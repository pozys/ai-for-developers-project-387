name: OpenCode Nightly Lighthouse

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: opencode-nightly-lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      LIGHTHOUSE_LABEL: lighthouse-nightly
      LIGHTHOUSE_ISSUE_TITLE: Nightly Lighthouse follow-up
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare Lighthouse report directory
        id: report-dir
        run: |
          REPORT_DIR="$RUNNER_TEMP/lighthouse-reports"
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          echo "path=$REPORT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare backend database
        working-directory: backend
        run: |
          mkdir -p var/data
          rm -f var/data/app.db
          APP_ENV=dev composer db:migrate
          APP_ENV=dev composer db:fixtures

      - name: Start backend server
        working-directory: backend
        run: |
          APP_ENV=dev composer serve > /tmp/opencode-backend.log 2>&1 &
          echo $! > /tmp/opencode-backend.pid

      - name: Wait for backend
        run: |
          timeout 60 bash -c \
            'until curl -sf http://127.0.0.1:8000/api/event-types > /dev/null; do sleep 2; done'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend preview
        working-directory: frontend
        run: |
          npx http-server@14.1.1 ./dist -a 127.0.0.1 -p 4173 -P http://127.0.0.1:8000? > /tmp/opencode-frontend.log 2>&1 &
          echo $! > /tmp/opencode-frontend.pid

      - name: Wait for frontend
        run: |
          timeout 60 bash -c \
            'until curl -sf http://127.0.0.1:4173/ > /dev/null; do sleep 2; done'

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Lighthouse CI collect
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx @lhci/cli@0.15.x collect --config=./lighthouserc.json

      - name: Export Lighthouse report
        working-directory: frontend
        run: npx @lhci/cli@0.15.x upload --config=./lighthouserc.json --target=filesystem --outputDir="${{ steps.report-dir.outputs.path }}"

      - name: Ensure rolling issue label exists
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const name = process.env.LIGHTHOUSE_LABEL;

            await github.rest.issues
              .getLabel({ owner, repo, name })
              .then(() => {})
              .catch(async (error) => {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: '0E8A16',
                  description: 'Rolling follow-up for nightly Lighthouse audits',
                });
              });

      - name: Upload Lighthouse artifact
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_number }}
          path: ${{ steps.report-dir.outputs.path }}
          retention-days: 14

      - name: Update rolling Lighthouse issue
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          REPORT_DIR: ${{ steps.report-dir.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const { owner, repo } = context.repo;
            const issueTitle = process.env.LIGHTHOUSE_ISSUE_TITLE;
            const label = process.env.LIGHTHOUSE_LABEL;
            const reportDir = process.env.REPORT_DIR;

            const reportFile = fs
              .readdirSync(reportDir)
              .find((file) => file.endsWith('.report.json'));

            if (!reportFile) {
              throw new Error(`No Lighthouse report JSON found in ${reportDir}`);
            }

            const report = JSON.parse(
              fs.readFileSync(path.join(reportDir, reportFile), 'utf8'),
            );

            const categories = Object.entries(report.categories ?? {});

            const scoreLine = categories
              .map(([id, category]) => {
                const score = category?.score;
                const value =
                  typeof score === 'number' ? Math.round(score * 100) : 'n/a';
                return `- ${category?.title ?? id}: ${value}`;
              })
              .join('\n');

            const clean = (value = '') =>
              value
                .replace(/<[^>]+>/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            const findingsByCategory = categories.map(([categoryId, category]) => {
              const auditRefs = category?.auditRefs ?? [];
              const findings = auditRefs
                .map((auditRef) => report.audits?.[auditRef.id])
                .filter(
                  (audit) =>
                    audit &&
                    typeof audit.score === 'number' &&
                    audit.score < 1 &&
                    audit.scoreDisplayMode !== 'notApplicable',
                )
                .slice(0, 8);

              if (findings.length === 0) {
                return `### ${category?.title ?? categoryId}\nNo follow-up needed.`;
              }

              const lines = findings.map((audit, index) => {
                const description = clean(audit.description);
                const suffix = description ? ` ${description}` : '';
                return `${index + 1}. **${audit.title}**.${suffix}`;
              });

              return `### ${category?.title ?? categoryId}\n${lines.join('\n')}`;
            });

            const now = new Date();
            const utcDate = now.toISOString();
            const moscowDate = new Intl.DateTimeFormat('en-GB', {
              dateStyle: 'medium',
              timeStyle: 'short',
              timeZone: 'Europe/Moscow',
            }).format(now);

            const body = [
              '## Latest Lighthouse Report',
              '',
              `**Run number:** ${context.runNumber}`,
              `**Run date:** ${utcDate} UTC / ${moscowDate} Europe/Moscow`,
              `**Run URL:** ${process.env.RUN_URL}`,
              `**Artifact URL:** ${process.env.ARTIFACT_URL}`,
              '**Audited URL:** http://127.0.0.1:4173/',
              '',
              '### Scores',
              scoreLine,
              '',
              '## Follow-up',
              findingsByCategory.join('\n\n'),
              '',
            ].join('\n');

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open label:${label} in:title "${issueTitle}"`,
              per_page: 10,
            });

            const issue = existing.data.items.find(
              (item) => item.title === issueTitle,
            );

            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                labels: [label],
                body,
              });
            }

      - name: Print server logs on failure
        if: failure()
        run: |
          printf '\n--- backend ---\n'
          sed -n '1,200p' /tmp/opencode-backend.log || true
          printf '\n--- frontend ---\n'
          sed -n '1,200p' /tmp/opencode-frontend.log || true

      - name: Stop local servers
        if: always()
        run: |
          if [ -f /tmp/opencode-frontend.pid ]; then
            kill "$(cat /tmp/opencode-frontend.pid)" || true
          fi
          if [ -f /tmp/opencode-backend.pid ]; then
            kill "$(cat /tmp/opencode-backend.pid)" || true
          fi
